<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماشین حساب اتوماتیک و مبدل ارزی P2P</title>
    <style>
        :root {
            --primary: #f3ba2f;
            --bg-page: #0b0e11;
            --bg-card: #181a20;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --border: #2b3139;
            --success: #0ecb81;
            --danger: #f6465d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calc-container {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border: 1px solid var(--border);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: var(--primary);
            font-size: 1.4rem;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        .input-box label {
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-main);
            font-weight: 600;
        }

        .input-box input {
            padding: 11px;
            background: #21262c;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            text-align: left;
            direction: ltr;
            box-sizing: border-box;
        }

        .input-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .full-width {
            grid-column: span 2;
        }

        .results-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .section-title {
            font-size: 0.9rem;
            color: var(--primary);
            margin-bottom: 12px;
            font-weight: bold;
        }

        .row-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #21262c;
            font-size: 0.95rem;
        }

        .row-item:last-child {
            border-bottom: none;
        }

        .val-style {
            font-weight: 700;
            direction: ltr;
        }

        .text-buy { color: var(--success); }
        .text-sell { color: var(--danger); }
        
        .conversion-box {
            background: #21262c;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="calc-container">
    <h2>📊 ماشین حساب هوشمند فرمول ارزی</h2>
    
    <!-- ورودی‌های اصلی بخش اول -->
    <div class="grid-inputs">
        <div class="input-box">
            <label>قیمت خرید اصلی (AFN):</label>
            <input type="number" id="mainBuy" placeholder="وارد کنید..." step="any" oninput="autoCalculate()">
        </div>
        <div class="input-box">
            <label>قیمت فروش اصلی (AFN):</label>
            <input type="number" id="mainSell" placeholder="وارد کنید..." step="any" oninput="autoCalculate()">
        </div>
        <div class="input-box">
            <label>فایده خرید:</label>
            <input type="number" id="profitBuy" value="2.3" step="any" oninput="autoCalculate()">
        </div>
        <div class="input-box">
            <label>فایده فروش:</label>
            <input type="number" id="profitSell" value="2.3" step="any" oninput="autoCalculate()">
        </div>
    </div>

    <!-- خروجی محاسبات فرمول‌ها -->
    <div class="results-section">
        <div class="row-item">
            <span>تفاوت اصلی بازار:</span>
            <span id="resDiff" class="val-style">-</span>
        </div>
        <div class="row-item text-buy">
            <span>قیمت خرید من:</span>
            <span id="resMyBuy" class="val-style">-</span>
        </div>
        <div class="row-item text-sell">
            <span>قیمت فروش من:</span>
            <span id="resMySell" class="val-style">-</span>
        </div>
        <div class="row-item" style="color: var(--primary);">
            <span>تفاوت من:</span>
            <span id="resMyDiff" class="val-style">-</span>
        </div>
    </div>

    <!-- بخش جدید و ویرایش‌شده تبدیل ارز -->
    <div class="conversion-box">
        <div class="section-title">🪙 بخش تبدیل مقدار افغانی به دالر</div>
        <div class="input-box full-width" style="margin-bottom: 12px;">
            <label style="color: #fff;">مقدار سرمایه به افغانی (AFN):</label>
            <input type="number" id="afnAmount" placeholder="مقدار را وارد کنید..." step="any" oninput="autoCalculate()">
        </div>
        
        <div class="row-item" style="font-size: 0.9rem;">
            <span>مقدار معادل به دالر (بر اساس خرید من):</span>
            <span id="convertBuy" class="val-style" style="color: var(--success);">-</span>
        </div>
        <div class="row-item" style="font-size: 0.9rem;">
            <span>مقدار معادل به دالر (بر اساس فروش من):</span>
            <span id="convertSell" class="val-style" style="color: var(--danger);">-</span>
        </div>
    </div>
</div>

<script>
function autoCalculate() {
    // ۱. دریافت داده‌های اولیه
    const mainBuy = parseFloat(document.getElementById('mainBuy').value);
    const mainSell = parseFloat(document.getElementById('mainSell').value);
    const profitBuy = parseFloat(document.getElementById('profitBuy').value) || 2.4;
    const profitSell = parseFloat(document.getElementById('profitSell').value) || 2.4;
    const afnAmount = parseFloat(document.getElementById('afnAmount').value);

    // بررسی مقادیر پایه برای جلوگیری از ایجاد خطای NaN روی صفحه
    if (isNaN(mainBuy) || isNaN(mainSell)) {
        resetOutputs();
        return;
    }

    // ۲. فرمول‌های اصلی شما
    const diff = mainSell - mainBuy;
    const average = (mainSell + mainBuy) / 2;
    
    const myBuy = average + (diff / profitBuy);
    const mySell = average - (diff / profitSell);
    const myDiff = mySell - myBuy;

    // نمایش نتایج فرمول در لایه اول
    document.getElementById('resDiff').innerText = diff.toFixed(2) + " AFN";
    document.getElementById('resMyBuy').innerText = myBuy.toFixed(2) + " AFN";
    document.getElementById('resMySell').innerText = mySell.toFixed(2) + " AFN";
    document.getElementById('resMyDiff').innerText = myDiff.toFixed(2) + " AFN";

    // ۳. فرمول‌های بخش تبدیل ارز افغانی
    if (!isNaN(afnAmount) && afnAmount > 0) {
        // تبدیل به دالر بر اساس نرخ خرید و فروش شما
        const dolBuy = afnAmount / myBuy;
        const dolSell = afnAmount / mySell;
        
        // نمایش خروجی‌های تبدیل ارز روی پنل صفحه
        document.getElementById('convertBuy').innerText = "$" + dolBuy.toFixed(2);
        document.getElementById('convertSell').innerText = "$" + dolSell.toFixed(2);
    } else {
        // بازنشانی بخش تبدیل در صورت خالی بودن باکس مقدار
        document.getElementById('convertBuy').innerText = "-";
        document.getElementById('convertSell').innerText = "-";
    }
}

function resetOutputs() {
    document.getElementById('resDiff').innerText = "-";
    document.getElementById('resMyBuy').innerText = "-";
    document.getElementById('resMySell').innerText = "-";
    document.getElementById('resMyDiff').innerText = "-";
    document.getElementById('convertBuy').innerText = "-";
    document.getElementById('convertSell').innerText = "-";
}
</script>

</body>
</html>
